version: '3.8'

services:
  sat-courses1:
    image: mongo:latest
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - sat_courses1_data:/data/db
    networks:
      - sat_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  sat-courses2:
    image: mongo:latest
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27018:27017'
    volumes:
      - sat_courses2_data:/data/db
    networks:
      - sat_network
    depends_on:
      - sat-courses1
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  sat-redis:
    image: redis:latest
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - sat_redis_data:/data
    networks:
      - sat_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  sat-courses-init:
    image: mongo:latest
    depends_on:
      sat-courses1:
        condition: service_healthy
      sat-courses2:
        condition: service_healthy
    networks:
      - sat_network
    command: >
      mongosh --host sat-courses1:27017 --eval '
        try {
          rs.status();
          print("Replica set already initialized");
        } catch(e) {
          rs.initiate({
            _id: "rs0",
            members: [
              {_id: 0, host: "sat-courses1:27017"},
              {_id: 1, host: "sat-courses2:27017"}
            ]
          });
          print("Replica set initialized");
        }'
    restart: on-failure

  sat-admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://sat-courses1:27017,sat-courses2:27017/satashkent-courses?replicaSet=rs0
      - REDIS_URL=redis://sat-redis:6379
      - REDIS_HOST=sat-redis
      - REDIS_PORT=6379
      - REDIS_TTL=300000
      - JWT_SECRET=JWT_SECRET
      - JWT_EXPIRE=1w
      - ADMIN_APP_URL=https://admin.educon.uz
      - USER_APP_URL=https://user.educon.uz
      - PORT=3000
    depends_on:
      sat-courses-init:
        condition: service_completed_successfully
      sat-redis:
        condition: service_healthy
    networks:
      - sat_network
    restart: unless-stopped
    volumes:
      - ./logs/admin:/app/logs
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sat-user:
    build:
      context: .
      dockerfile: Dockerfile
      target: user
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://sat-courses1:27017,sat-courses2:27017/satashkent-courses?replicaSet=rs0
      - REDIS_URL=redis://sat-redis:6379
      - REDIS_HOST=sat-redis
      - REDIS_PORT=6379
      - REDIS_TTL=300000
      - JWT_SECRET=JWT_SECRET
      - JWT_EXPIRE=1w
      - ADMIN_APP_URL=https://admin.educon.uz
      - USER_APP_URL=https://user.educon.uz
      - PORT=4000
    depends_on:
      sat-courses-init:
        condition: service_completed_successfully
      sat-redis:
        condition: service_healthy
    networks:
      - sat_network
    restart: unless-stopped
    volumes:
      - ./logs/user:/app/logs
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  sat_courses1_data:
  sat_courses2_data:
  sat_redis_data:

networks:
  sat_network:
    driver: bridge